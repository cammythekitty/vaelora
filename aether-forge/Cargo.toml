[package]
name = "vaelora-dashboard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vaelora-dashboard"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
toml = "0.8"
