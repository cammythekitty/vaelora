server {
    listen 80;
    listen [::]:80;
    server_name vaelora.dev www.vaelora.dev;

    # Redirect www → non-www
    if ($host = www.vaelora.dev) {
        return 301 https://vaelora.dev$request_uri;
    }

    # Cloudflare Tunnel handles TLS termination, so Nginx only needs
    # to listen on 80 locally. If you ever want Nginx to do TLS too,
    # add certbot and uncomment the block below.
    #
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";   # needed for WebSockets

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        # Buffer tuning (adjust for your app size)
        proxy_buffer_size        16k;
        proxy_buffers            4 32k;
        proxy_busy_buffers_size  64k;
    }

    # Optional: serve a custom 502 page when your app is down
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/vaelora.dev;
        internal;
    }
}