<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vaelora.dev</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
    }

    .card {
      text-align: center;
      padding: 3rem 4rem;
      border: 1px solid #2d2d3a;
      border-radius: 1.5rem;
      background: #12121c;
      box-shadow: 0 0 60px rgba(139, 92, 246, 0.08);
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #8b5cf6;
      border-radius: 50%;
      margin-bottom: 1.5rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f8fafc;
    }

    h1 span { color: #8b5cf6; }

    p {
      margin-top: 0.75rem;
      font-size: 1rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>vaelora<span>.dev</span></h1>
    <p>Something is being built here.</p>
  </div>
</body>
</html>
